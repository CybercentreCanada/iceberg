# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - cccs-release

pool:
  vmImage: ubuntu-latest

variables:
  - group: MAVEN_PUBLISH_ARGS
  - name: isPublish
    value: true

steps:
  - task: Gradle@3
    displayName: "Build org.cccs.iceberg"
    inputs:
      workingDirectory: ""
      gradleWrapperFile: "gradlew"
      gradleOptions: "-Xmx3072m"
      javaHomeOption: "JDKVersion"
      jdkVersionOption: "1.17"
      jdkArchitectureOption: "x64"
      publishJUnitResults: true
      testResultsFiles: "**/TEST-*.xml"
      tasks: "build -x test -x integrationTest"
      options: >
        -DknownSparkVersions=4.1
        -DdefaultSparkVersions=4.1
  - task: Gradle@3
    displayName: "Publish org.cccs.iceberg"
    condition: eq(variables.isPublish, true)
    inputs:
      workingDirectory: ""
      gradleWrapperFile: "gradlew"
      gradleOptions: "-Xmx3072m"
      javaHomeOption: "JDKVersion"
      jdkVersionOption: "1.17"
      jdkArchitectureOption: "x64"
      publishJUnitResults: true
      testResultsFiles: "**/TEST-*.xml"
      tasks: "publish"
      options: >
        -DknownSparkVersions=4.1
        -DdefaultSparkVersions=4.1
        -PMAVEN_USER=$(MAVENUSER)
        -PMAVEN_PWD=$(MAVENPWD)
