# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - cccs-release
      - iceberg-*


pool:
  vmImage: ubuntu-latest


variables:
  - group: MAVEN_PUBLISH_ARGS
  - name: isPublish
    value: true #$[eq(variables['Build.SourceBranch'], 'refs/heads/cccs-release')]


stages:
  - stage: Build
    jobs:
      - job: BuildGradle
        steps:
          - task: Gradle@3
            displayName: 'Build org.cccs.iceberg'
            inputs:
              workingDirectory: ''
              gradleWrapperFile: 'gradlew'
              gradleOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'
              tasks: 'build -x test -x integrationTest'
              options: >
                -DknownSparkVersions=3.5
                -DdefaultSparkVersions=3.5
          # - script: |
          #     ./cccs-publish.sh
          #   condition: succeeded()
          #   displayName: 'Copy spark jars'
          # - task: PublishBuildArtifacts@1
          #   condition: succeeded()
          #   inputs:
          #     PathtoPublish: "$(Build.SourcesDirectory)/build"
          #     ArtifactName: "iceberg"
          #     publishLocation: "Container"
  - stage: Publish
    jobs:
      - job: PublishGradle              
        steps:
          # - task: DownloadPipelineArtifact@2
          #   displayName: 'Download Build Artifact'
          #   inputs:
          #     artifact: 'iceberg'
          #     path: '$(Pipeline.Workspace)/java-package'      

          # - script: ls -R $(Pipeline.Workspace)/java-package
          #   displayName: 'List downloaded JARs'            
            
          # - script: |
          #     export JAR_PATH=$(find $(Pipeline.Workspace)/java-package -name "*.jar" | head -n 1)
          #     echo "##vso[task.setvariable variable=PUBLISH_JAR_PATH]$JAR_PATH"
          #     echo "Publishing: ${JAR_PATH}"
          #   displayName: 'Locate JAR file'            

          - task: Gradle@3
            displayName: 'Publish org.cccs.iceberg'
            condition: and(succeeded(), eq(variables.isPublish, true))
            inputs:
              workingDirectory: ''
              gradleWrapperFile: 'gradlew'
              gradleOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml'
              tasks: 'publish'
              options: >
                -PMAVEN_USER=cccs-stratus
                -PMAVEN_PWD=$(System.AccessToken)
                -PPUBLISH_JAR_PATH=$(PUBLISH_JAR_PATH)
